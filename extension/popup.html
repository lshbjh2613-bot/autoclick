<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>서버 시간 예약 클릭</title></head>
<body>
<h1>서버 시간 예약 클릭</h1>
<p>로그인한 사이트를 현재 탭에 열어 주세요.</p>
<label for="url">사이트 주소</label><input id="url" type="url" placeholder="https://nol.yanolja.com/…">
<button id="open">주소 열기</button>
<button id="pick">① 페이지에서 버튼 선택</button>
<p id="selection">선택한 버튼 없음</p>
<button id="sync">② 서버 시간 측정</button>
<p id="clock">측정 전</p>
<label for="time">목표 시각 · 한국 시간 (UTC+9)</label>
<input id="time" type="datetime-local" step="1">
<label class="check"><input id="waitActive" type="checkbox"> 카운트다운 → 예매 버튼 활성화 대기</label>
<label for="activeLabel">활성화 후 버튼 문구</label><input id="activeLabel" value="예매하기">
<p class="note">대기 모드는 목표 시각부터 최대 10초간 같은 경기의 선택 영역을 확인합니다. 문구가 일치하고 활성화되면 한 번 클릭합니다. 경기 정보가 바뀌면 중단합니다.</p>
<p class="note">HTTP Date는 초 단위이며 CDN 시간일 수 있습니다. 정각 도착은 보장하지 않습니다. 예약은 10분 이내만 가능하며, 탭을 화면에 유지해야 합니다.</p>
<button id="arm">③ 한 번 클릭 예약</button><button id="cancel">예약 취소</button>
<p id="status" role="status" aria-live="polite"></p>
<script src="popup.js"></script></body></html>
